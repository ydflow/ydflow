<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#111a24"/>
    </linearGradient>
    <linearGradient id="bar" x1="72" y1="0" x2="1128" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3fb950"/>
      <stop offset="0.5" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(300 190) rotate(90) scale(120 300)">
      <stop stop-color="#58a6ff" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="320" fill="url(#glow)"/>

  <!-- terminal chrome -->
  <rect x="0" y="0" width="1200" height="48" fill="#151e29"/>
  <circle cx="76" cy="24" r="6" fill="#ff5f57"/>
  <circle cx="98" cy="24" r="6" fill="#febc2e"/>
  <circle cx="120" cy="24" r="6" fill="#28c840"/>
  <text x="600" y="30" fill="#5b6b7c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" text-anchor="middle">ydflow — bash</text>
  <rect x="0" y="48" width="1200" height="1" fill="#223041"/>

  <!-- prompt -->
  <text x="72" y="122" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22">$ whoami</text>

  <!-- name + cursor -->
  <text x="72" y="198" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="58" font-weight="700">ydflow</text>
  <rect x="292" y="152" width="15" height="44" fill="#3fb950" fill-opacity="0.9"/>

  <!-- tagline -->
  <text x="74" y="246" fill="#93a1b0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20">构建可观测、可信任的 AI Agent 与智能工作流</text>

  <rect x="72" y="284" width="1056" height="3" rx="1.5" fill="url(#bar)"/>
</svg>
