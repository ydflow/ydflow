name: GitHub - Activity - Readme
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
  # 手动推送后立即刷新活动区
  push:
    branches: ["master", "main"]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # 用上游 action，不依赖个人 fork
      - uses: jamesgeorge007/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 活动区写入后一并清除 banner CDN 缓存，保证推送即生效
      - name: Purge jsDelivr CDN cache
        continue-on-error: true
        run: |
          echo ">> purging banner.svg"
          curl -sS --max-time 60 \
            "https://purge.jsdelivr.net/gh/ydflow/ydflow@master/banner.svg" || true
