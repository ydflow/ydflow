name: Metrics
on:
  # 每天 UTC 0 点（北京时间早 8 点）自动更新一次
  schedule: [{cron: "0 0 * * *"}]
  # 支持在 Actions 页面手动点击运行
  workflow_dispatch:
  # 提交到主分支时自动运行
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      # 生成 metrics SVG
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ydflow

          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Shanghai

          plugin_languages: yes
          plugin_languages_ignored: html, css, glsl
          plugin_languages_details: percentage
          plugin_languages_limit: 8

          # 只展示自有项目，避免 fork 稀释门面
          plugin_repositories_featured: >
            ydflow/cyber-girlfriend-16gb,
            ydflow/rixu-miniprogram-open,
            ydflow/jianying-editor-skill-reliable,
            ydflow/rixu-miniprogram

          filename: github-metrics.svg
          output_action: commit
          committer_branch: master
          committer_message: "chore: update metrics"

      # 清除 jsDelivr 对 banner 与 metrics 的 CDN 缓存，
      # 使 README 中的 @master 引用无需手动改 hash 即可拿到最新图
      - name: Purge jsDelivr CDN cache
        continue-on-error: true
        run: |
          for f in banner.svg github-metrics.svg; do
            echo ">> purging $f"
            curl -sS --max-time 60 \
              "https://purge.jsdelivr.net/gh/ydflow/ydflow@master/$f" || true
          done
